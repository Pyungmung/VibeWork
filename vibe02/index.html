<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="인접한 사과 숫자를 연결해 합이 10이 되도록 만드는 퍼즐 게임">
  <title>사과 숫자 퍼즐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div class="brand-block">
        <p class="eyebrow">APPLE PUZZLE / 01</p>
        <h1>사과 숫자 퍼즐</h1>
        <p class="instructions">인접한 사과를 연결해 <strong>합이 10</strong>이 되면 수확하세요.</p>
      </div>
      <button class="restart-button" id="restartButton" type="button">
        <span aria-hidden="true">↻</span>
        다시 시작
      </button>
    </header>

    <section class="score-strip" aria-label="게임 정보">
      <div class="score-card">
        <span class="score-label">현재 점수</span>
        <strong id="scoreValue">0</strong>
      </div>
      <div class="score-card total-card" id="sumCard" aria-live="polite">
        <span class="score-label">선택 합계</span>
        <strong><span id="sumValue">0</span><small> / 10</small></strong>
      </div>
      <div class="score-note" id="statusMessage" aria-live="polite">사과를 길게 눌러 연결하세요</div>
    </section>

    <section class="board-wrap">
      <div class="board-heading">
        <span>HARVEST GRID</span>
        <span>8 × 6</span>
      </div>
      <div class="game-board" id="gameBoard" role="grid" aria-label="8행 6열 사과 숫자 퍼즐 보드"></div>
    </section>

    <footer class="game-footer">
      <span><i class="legend-dot"></i>상하좌우로만 연결</span>
      <span>사과 1개 = <b>2점</b></span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
